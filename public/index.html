<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调解室</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f5f5f0; min-height: 100vh; padding: 2rem 1rem; }
.app { max-width: 640px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
.subtitle { font-size: 14px; color: #888; margin-bottom: 1.5rem; }
.hidden { display: none !important; }

/* Entry phase */
.entry-card { border: 1px solid #e0e0e0; border-radius: 12px; background: white; padding: 20px; margin-bottom: 12px; }
.entry-title { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
.entry-desc { font-size: 13px; color: #888; margin-bottom: 12px; line-height: 1.6; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; background: white; }
.field input:focus { outline: none; border-color: #aaa; }
.or-divider { text-align: center; font-size: 13px; color: #bbb; margin: 16px 0; }

.btn { padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; width: 100%; }
.btn-primary { background: #222; color: white; }
.btn-primary:disabled { opacity: 0.35; cursor: default; }
.btn-secondary { background: white; color: #222; border: 1px solid #ddd; margin-top: 8px; }

/* Room code display */
.code-display { text-align: center; margin: 16px 0; }
.code-value { font-size: 32px; font-weight: 600; letter-spacing: 6px; color: #222; font-family: 'SF Mono', 'Menlo', monospace; }
.code-hint { font-size: 13px; color: #888; margin-top: 8px; }
.btn-copy { padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: white; color: #666; margin-top: 8px; }

/* Status indicators */
.status-bar { padding: 10px 14px; border-radius: 8px; font-size: 13px; text-align: center; margin-bottom: 12px; }
.status-waiting { background: #FFF8E6; color: #8B6914; border: 1px solid #F0D87A; }
.status-ok { background: #E1F5EE; color: #0F6E56; border: 1px solid #1D9E75; }
.status-analyzing { background: #E6F1FB; color: #185FA5; border: 1px solid #378ADD; }

/* Input area */
.input-label { font-size: 13px; color: #888; margin-bottom: 6px; }
textarea { width: 100%; min-height: 130px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; resize: vertical; line-height: 1.6; background: white; }
textarea:focus { outline: none; border-color: #aaa; }
.char-count { text-align: right; font-size: 12px; color: #bbb; margin-top: 4px; }
.char-count.warning { color: #e07000; }

/* Result cards */
.card { border: 1px solid #e0e0e0; border-radius: 12px; background: white; overflow: hidden; margin-bottom: 12px; }
.card-header { padding: 10px 14px; font-size: 13px; font-weight: 500; border-bottom: 1px solid #eee; }
.card-header.mine { background: #E1F5EE; color: #0F6E56; }
.card-header.both { background: #FAEEDA; color: #854F0B; }
.card-header.neutral { background: #f5f5f5; color: #666; }
.card-body { padding: 14px; font-size: 15px; line-height: 1.75; color: #222; white-space: pre-wrap; }
.card-body.locked { color: #bbb; font-size: 14px; }

.consent-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #eee; background: #fafafa; align-items: center; }
.consent-status { font-size: 13px; color: #888; flex: 1; }
.consent-btn { padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: white; }
.consent-btn.done { background: #E1F5EE; border-color: #1D9E75; color: #0F6E56; pointer-events: none; }

.error-card { border: 1px solid #f0c0c0; border-radius: 12px; background: #fff8f8; padding: 16px; margin-bottom: 12px; }
.error-title { font-size: 14px; font-weight: 500; color: #c00; margin-bottom: 8px; }
.error-msg { font-size: 14px; color: #666; line-height: 1.6; }

.divider { height: 1px; background: #eee; margin: 1.5rem 0; }
.section-label { font-size: 12px; color: #bbb; margin-bottom: 10px; letter-spacing: 0.05em; }

/* Follow-up */
.fitem { border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden; margin-top: 10px; }
.fitem-who { padding: 8px 14px; font-size: 12px; font-weight: 500; border-bottom: 1px solid #eee; background: #f5f5f5; color: #666; }
.fitem-q { padding: 10px 14px; font-size: 14px; color: #888; font-style: italic; border-bottom: 1px solid #eee; }
.fitem-ans { padding: 12px 14px; font-size: 15px; line-height: 1.75; color: #222; white-space: pre-wrap; }

.btn-followup { margin-top: 8px; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: #222; color: white; }
.btn-followup:disabled { opacity: 0.35; cursor: default; }
.fchar-count { text-align: right; font-size: 12px; color: #bbb; margin-top: 4px; }
.fchar-count.warning { color: #e07000; }

.dots { display: inline-flex; gap: 4px; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: #aaa; animation: b 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes b { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }
</style>
</head>
<body>
<div class="app">
  <h1>调解室</h1>
  <p class="subtitle">两人分别写下各自的感受，AI 在保护隐私的前提下给出分析。</p>

  <!-- Phase 1: Entry -->
  <div id="phase-entry">
    <div class="entry-card" id="create-section">
      <div class="entry-title">创建新房间</div>
      <div class="entry-desc">创建一个房间，把链接发给对方。</div>
      <div class="field">
        <label>你的昵称</label>
        <input type="text" id="create-name" placeholder="输入你的昵称" maxlength="20">
      </div>
      <button class="btn btn-primary" id="btn-create" onclick="createRoom()">创建房间</button>
    </div>

    <div class="or-divider" id="or-divider">或</div>

    <div class="entry-card" id="join-section">
      <div class="entry-title">加入房间</div>
      <div class="entry-desc">输入你的昵称，加入对方创建的房间。</div>
      <div class="field" id="join-code-field">
        <label>房间码</label>
        <input type="text" id="join-code" placeholder="输入4位房间码" maxlength="4" style="text-transform:uppercase;letter-spacing:4px;font-family:'SF Mono','Menlo',monospace;">
      </div>
      <div class="field">
        <label>你的昵称</label>
        <input type="text" id="join-name" placeholder="输入你的昵称" maxlength="20">
      </div>
      <button class="btn btn-primary" id="btn-join" onclick="joinRoom()">加入</button>
    </div>

    <div id="entry-error" class="hidden" style="margin-top:12px;"></div>
  </div>

  <!-- Phase 2: Room (input + waiting + results + followup) -->
  <div id="phase-room" class="hidden">

    <!-- Room code display -->
    <div id="room-code-section" class="hidden">
      <div class="code-display">
        <div class="code-value" id="display-code"></div>
        <div class="code-hint">把下方链接发给对方，对方打开即可加入</div>
        <button class="btn-copy" onclick="copyLink()">复制邀请链接</button>
      </div>
      <div class="divider"></div>
    </div>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar status-waiting"></div>

    <!-- Input section -->
    <div id="input-section">
      <p class="input-label" id="input-label">说说这件事对你来说是什么感受？发生了什么？</p>
      <textarea id="my-input" placeholder="写下你想说的……" maxlength="500" oninput="updateInputCount()"></textarea>
      <div class="char-count" id="input-count">0 / 500</div>
      <button class="btn btn-primary" id="btn-submit" onclick="submitInput()" disabled>提交</button>
    </div>

    <!-- Waiting for analysis -->
    <div id="waiting-section" class="hidden">
      <div class="card">
        <div class="card-header neutral">等待中</div>
        <div class="card-body" id="waiting-text">等待对方提交……</div>
      </div>
    </div>

    <!-- Analyzing -->
    <div id="analyzing-section" class="hidden">
      <div class="card">
        <div class="card-header neutral">AI 正在分析</div>
        <div class="card-body"><div class="dots"><span></span><span></span><span></span></div></div>
      </div>
    </div>

    <!-- Results -->
    <div id="result-section" class="hidden">
      <div class="card">
        <div class="card-header mine" id="result-header"></div>
        <div class="card-body" id="result-body"></div>
      </div>

      <div class="card" id="both-card">
        <div class="card-header both">关于这件事</div>
        <div class="card-body" id="both-body"></div>
        <div class="consent-row" id="consent-row">
          <span class="consent-status" id="consent-status"></span>
          <button class="consent-btn" id="btn-consent" onclick="giveConsent()">我同意公开</button>
        </div>
      </div>

      <div class="divider"></div>
      <p class="section-label">追问</p>
      <textarea id="followup-input" placeholder="我想进一步说明……" maxlength="300" oninput="updateFollowupCount()"></textarea>
      <div class="fchar-count" id="followup-count">0 / 300</div>
      <button class="btn-followup" id="btn-followup" onclick="submitFollowup()" disabled>提交追问</button>
      <div id="followup-history"></div>
    </div>
  </div>
</div>

<script>
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Session state
let S = {
  code: null,
  token: null,
  role: null,
  myName: null,
  otherName: null,
  submitted: false,
  myConsent: false,
};

let pollTimer = null;

// ─── Entry: Create Room ───
async function createRoom() {
  const name = document.getElementById('create-name').value.trim();
  if (!name) return showEntryError('请输入昵称');
  clearEntryError();

  try {
    const r = await fetch('/api/room/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);

    S.code = data.code;
    S.token = data.token;
    S.role = 'a';
    S.myName = name;
    saveSession();
    enterRoom(true);
  } catch (e) {
    showEntryError(e.message);
  }
}

// ─── Entry: Join Room ───
async function joinRoom() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const name = document.getElementById('join-name').value.trim();
  if (!code) return showEntryError('请输入房间码');
  if (!name) return showEntryError('请输入昵称');
  clearEntryError();

  try {
    const r = await fetch('/api/room/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, name })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);

    S.code = data.code;
    S.token = data.token;
    S.role = 'b';
    S.myName = name;
    S.otherName = data.nameA;
    saveSession();
    enterRoom(false);
  } catch (e) {
    showEntryError(e.message);
  }
}

// ─── Enter Room UI ───
function enterRoom(isCreator) {
  document.getElementById('phase-entry').classList.add('hidden');
  document.getElementById('phase-room').classList.remove('hidden');

  // Show room code for creator
  if (isCreator) {
    document.getElementById('room-code-section').classList.remove('hidden');
    document.getElementById('display-code').textContent = S.code;
  }

  // Set up input label
  document.getElementById('input-label').textContent = S.myName + '，说说这件事对你来说是什么感受？发生了什么？';
  updateStatusBar();
  startPolling();
}

// ─── Submit Input ───
async function submitInput() {
  const input = document.getElementById('my-input').value.trim();
  if (!input) return;

  document.getElementById('btn-submit').disabled = true;
  document.getElementById('btn-submit').textContent = '提交中…';

  try {
    const r = await fetch('/api/room/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: S.code, token: S.token, input })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);

    S.submitted = true;
    saveSession();

    if (data.status === 'analyzed') {
      // This was the second submission, analysis done
      await fetchAndShowResults();
    } else {
      // Waiting for other party
      document.getElementById('input-section').classList.add('hidden');
      document.getElementById('waiting-section').classList.remove('hidden');
      document.getElementById('waiting-text').textContent = S.otherName ? '等待 ' + S.otherName + ' 提交……' : '等待对方提交……';
    }
  } catch (e) {
    document.getElementById('btn-submit').disabled = false;
    document.getElementById('btn-submit').textContent = '提交';
    showEntryError(e.message);
  }
}

// ─── Polling ───
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollStatus, 3000);
}

async function pollStatus() {
  if (!S.code || !S.token) return;

  try {
    const r = await fetch(`/api/room/status?code=${S.code}&token=${S.token}`);

    // Room expired or not found
    if (r.status === 404) {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      sessionStorage.removeItem('mediator_session');
      document.getElementById('phase-room').innerHTML = `
        <div class="error-card">
          <div class="error-title">房间已过期</div>
          <div class="error-msg">这个房间已经不存在了（房间会在创建 24 小时后自动过期）。</div>
          <button class="btn btn-primary" style="margin-top:12px;" onclick="window.location.href='/'">重新开始</button>
        </div>`;
      return;
    }

    if (!r.ok) return;
    const data = await r.json();

    // Update other's name
    if (data.otherName && !S.otherName) {
      S.otherName = data.otherName;
      saveSession();
      updateStatusBar();
    }

    // Check if analysis is done and results not yet shown
    if (data.status === 'analyzed' && document.getElementById('result-section').classList.contains('hidden')) {
      await fetchAndShowResults();
    }

    // Check analyzing state
    if (data.status === 'analyzing' && S.submitted) {
      document.getElementById('waiting-section').classList.add('hidden');
      document.getElementById('analyzing-section').classList.remove('hidden');
    }

    // Check consent updates
    if (data.status === 'analyzed') {
      updateConsent(data.consentA, data.consentB, data.forBoth);
      // Stop polling once both consented — nothing left to sync
      if (data.consentA && data.consentB && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    updateStatusBar(data);
  } catch (e) {
    // silent
  }
}

async function fetchAndShowResults() {
  try {
    const r = await fetch(`/api/room/status?code=${S.code}&token=${S.token}`);
    const data = await r.json();
    if (data.status !== 'analyzed') return;

    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

    // Hide other sections
    document.getElementById('input-section').classList.add('hidden');
    document.getElementById('waiting-section').classList.add('hidden');
    document.getElementById('analyzing-section').classList.add('hidden');
    document.getElementById('room-code-section').classList.add('hidden');
    document.getElementById('status-bar').classList.add('hidden');

    // Show results
    const rs = document.getElementById('result-section');
    rs.classList.remove('hidden');
    document.getElementById('result-header').textContent = S.myName + '，我想告诉你';
    document.getElementById('result-body').textContent = data.myAnalysis;

    updateConsent(data.consentA, data.consentB, data.forBoth);

    // Show history if any
    if (data.myHistory && data.myHistory.length > 0) {
      renderHistory(data.myHistory);
    }

    // Restart polling (slower) for consent updates
    pollTimer = setInterval(pollStatus, 5000);
  } catch (e) {
    // silent
  }
}

// ─── Consent ───
function updateConsent(consentA, consentB, forBoth) {
  const myConsent = S.role === 'a' ? consentA : consentB;
  const otherConsent = S.role === 'a' ? consentB : consentA;
  S.myConsent = myConsent;

  const btn = document.getElementById('btn-consent');
  const statusEl = document.getElementById('consent-status');
  const bodyEl = document.getElementById('both-body');

  if (myConsent && otherConsent && forBoth) {
    bodyEl.textContent = forBoth;
    bodyEl.className = 'card-body';
    document.getElementById('consent-row').classList.add('hidden');
  } else if (myConsent) {
    bodyEl.textContent = '双方同意分享后显示……';
    bodyEl.className = 'card-body locked';
    btn.textContent = '已同意';
    btn.className = 'consent-btn done';
    statusEl.textContent = '等待' + (S.otherName || '对方') + '同意';
  } else if (otherConsent) {
    bodyEl.textContent = '双方同意分享后显示……';
    bodyEl.className = 'card-body locked';
    statusEl.textContent = (S.otherName || '对方') + '已同意，等待你';
  } else {
    bodyEl.textContent = '双方同意分享后显示……';
    bodyEl.className = 'card-body locked';
    statusEl.textContent = '双方都同意后，将显示共同总结';
  }
}

async function giveConsent() {
  try {
    const r = await fetch('/api/room/consent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: S.code, token: S.token })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    updateConsent(data.consentA, data.consentB, data.forBoth);
  } catch (e) {
    // silent
  }
}

// ─── Follow-up ───
function updateFollowupCount() {
  const v = document.getElementById('followup-input').value;
  const fc = document.getElementById('followup-count');
  fc.textContent = v.length + ' / 300';
  fc.className = 'fchar-count' + (v.length > 250 ? ' warning' : '');
  document.getElementById('btn-followup').disabled = !v.trim();
}

async function submitFollowup() {
  const q = document.getElementById('followup-input').value.trim();
  if (!q) return;

  document.getElementById('btn-followup').disabled = true;
  const fh = document.getElementById('followup-history');
  const tmp = document.createElement('div');
  tmp.className = 'fitem';
  tmp.innerHTML = `<div class="fitem-who">你的追问</div><div class="fitem-q">${esc(q)}</div><div class="fitem-ans"><div class="dots"><span></span><span></span><span></span></div></div>`;
  fh.appendChild(tmp);

  try {
    const r = await fetch('/api/room/followup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: S.code, token: S.token, question: q })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);

    tmp.querySelector('.fitem-ans').textContent = data.answer;
    document.getElementById('followup-input').value = '';
    updateFollowupCount();
  } catch (e) {
    tmp.querySelector('.fitem-ans').textContent = '出错了：' + e.message;
  }
  document.getElementById('btn-followup').disabled = !document.getElementById('followup-input').value.trim();
}

function renderHistory(history) {
  const fh = document.getElementById('followup-history');
  fh.innerHTML = history.map(h => `
    <div class="fitem">
      <div class="fitem-who">你的追问</div>
      <div class="fitem-q">${esc(h.question)}</div>
      <div class="fitem-ans">${esc(h.answer)}</div>
    </div>`).join('');
}

// ─── UI Helpers ───
function updateStatusBar(data) {
  const bar = document.getElementById('status-bar');
  if (!S.otherName) {
    bar.className = 'status-bar status-waiting';
    bar.textContent = '等待对方加入……';
  } else if (!S.submitted) {
    bar.className = 'status-bar status-ok';
    bar.textContent = S.otherName + ' 已加入';
  } else if (data && data.status === 'analyzing') {
    bar.className = 'status-bar status-analyzing';
    bar.textContent = 'AI 正在分析……';
  } else if (data && data.status === 'analyzed') {
    bar.className = 'status-bar status-ok';
    bar.textContent = '分析完成';
  } else {
    bar.className = 'status-bar status-waiting';
    bar.textContent = '等待' + (S.otherName || '对方') + '提交……';
  }

  // Enable submit button
  updateInputCount();
}

function updateInputCount() {
  const v = document.getElementById('my-input').value;
  const c = document.getElementById('input-count');
  c.textContent = v.length + ' / 500';
  c.className = 'char-count' + (v.length > 450 ? ' warning' : '');
  document.getElementById('btn-submit').disabled = !v.trim() || S.submitted;
}

function showEntryError(msg) {
  const el = document.getElementById('entry-error');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="error-card"><div class="error-title">出了点问题</div><div class="error-msg">${esc(msg)}</div></div>`;
}

function clearEntryError() {
  document.getElementById('entry-error').classList.add('hidden');
}

function copyLink() {
  const link = window.location.origin + '?room=' + S.code;
  navigator.clipboard.writeText(link).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = '复制邀请链接', 2000);
  });
}

// ─── Session persistence (survives page refresh within same tab) ───
function saveSession() {
  sessionStorage.setItem('mediator_session', JSON.stringify(S));
}

function loadSession() {
  const saved = sessionStorage.getItem('mediator_session');
  if (saved) {
    try { S = JSON.parse(saved); } catch (e) { return false; }
    return S.code && S.token;
  }
  return false;
}

// ─── Init: check for existing session or URL params ───
(function init() {
  if (loadSession()) {
    // Resume existing session
    document.getElementById('phase-entry').classList.add('hidden');
    document.getElementById('phase-room').classList.remove('hidden');

    if (S.role === 'a' && !S.otherName) {
      document.getElementById('room-code-section').classList.remove('hidden');
      document.getElementById('display-code').textContent = S.code;
    }

    document.getElementById('input-label').textContent = S.myName + '，说说这件事对你来说是什么感受？发生了什么？';

    if (S.submitted) {
      document.getElementById('input-section').classList.add('hidden');
      document.getElementById('waiting-section').classList.remove('hidden');
      // Poll will handle showing results
    }

    updateStatusBar();
    startPolling();
    pollStatus();
    return;
  }

  // Check URL for room parameter (invited user)
  const urlParams = new URLSearchParams(window.location.search);
  const roomCode = urlParams.get('room');

  if (roomCode) {
    // Invited user: only show join section, pre-fill room code
    document.getElementById('create-section').classList.add('hidden');
    document.getElementById('or-divider').classList.add('hidden');
    document.getElementById('join-code').value = roomCode.toUpperCase();
    document.getElementById('join-code-field').classList.add('hidden');
  }
})();
</script>
</body>
</html>
